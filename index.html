<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contagem Regressiva</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    h1 {
      font-size: clamp(1.2rem, 4vw, 2rem);
      margin-bottom: 20px;
    }

    #contador {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 70px;
    }

    .grupo {
      display: flex;
    }

    .odometro {
      overflow: hidden;
      height: clamp(45px, 10vw, 70px);
      width: clamp(30px, 8vw, 55px);
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      margin: 2px;
    }

    .numeros {
      display: flex;
      flex-direction: column;
      transition: transform 0.5s ease-in-out;
    }

    .numeros div {
      height: clamp(45px, 10vw, 70px);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(1.2rem, 5vw, 2.2rem);
      font-weight: bold;
    }

    .label {
      margin-top: 6px;
      font-size: clamp(0.7rem, 3vw, 1rem);
      color: #cbd5f5;
    }

    /* 📱 MOBILE MAIS LEGÍVEL */
    @media (max-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }

      .label {
        font-size: 1.1rem;
      }

      .numeros div {
        font-size: 2.6rem;
      }
    }

    /* 🎉 CONFETE */
    .confete {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 10px;
      opacity: 0.9;
      animation: cair linear forwards;
      border-radius: 2px;
      z-index: 9999;
    }

    @keyframes cair {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    /* 🎆 FOGOS */
    .fogo {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: explodir 1s ease-out forwards;
      z-index: 9999;
    }

    @keyframes explodir {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(20);
        opacity: 0;
      }
    }

    .final {
      font-size: 2rem;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Está chegando o grande momento 🎉</h1>

  <div id="contador">
    <div class="box">
      <div class="grupo" id="dias"></div>
      <div class="label">dias</div>
    </div>

    <div class="box">
      <div class="grupo" id="horas"></div>
      <div class="label">horas</div>
    </div>

    <div class="box">
      <div class="grupo" id="minutos"></div>
      <div class="label">minutos</div>
    </div>

    <div class="box">
      <div class="grupo" id="segundos"></div>
      <div class="label">segundos</div>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

function criarDigito() {
  const container = document.createElement("div");
  container.classList.add("odometro");

  const numeros = document.createElement("div");
  numeros.classList.add("numeros");

  for (let i = 0; i < 10; i++) {
    const num = document.createElement("div");
    num.textContent = i;
    numeros.appendChild(num);
  }

  container.appendChild(numeros);
  return { container, numeros };
}

function criarGrupo(id, quantidade) {
  const grupo = document.getElementById(id);
  const digitos = [];

  for (let i = 0; i < quantidade; i++) {
    const digito = criarDigito();
    grupo.appendChild(digito.container);
    digitos.push(digito.numeros);
  }

  return digitos;
}

const diasDigitos = criarGrupo("dias", 2);
const horasDigitos = criarGrupo("horas", 2);
const minutosDigitos = criarGrupo("minutos", 2);
const segundosDigitos = criarGrupo("segundos", 2);

function atualizarDigitos(valor, digitos) {
  const str = valor.toString().padStart(digitos.length, "0");

  str.split("").forEach((num, i) => {
    const altura = digitos[i].parentElement.offsetHeight;
    const offset = num * altura;
    digitos[i].style.transform = `translateY(-${offset}px)`;
  });
}

function getTargetDate() {
  const agora = new Date();
  const alvo = new Date();
  alvo.setDate(agora.getDate() + 1);
  alvo.setHours(16, 0, 0, 0);
  return alvo;
}

const dataAlvo = getTargetDate();

function atualizar() {
  const agora = new Date();
  const diff = dataAlvo - agora;

  if (diff <= 0) {
    document.body.innerHTML = "<div class='final'>🎊 Chegou o grande momento!</div>";
    return;
  }

  const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
  const horas = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutos = Math.floor((diff / (1000 * 60)) % 60);
  const segundos = Math.floor((diff / 1000) % 60);

  atualizarDigitos(dias, diasDigitos);
  atualizarDigitos(horas, horasDigitos);
  atualizarDigitos(minutos, minutosDigitos);
  atualizarDigitos(segundos, segundosDigitos);
}

setInterval(atualizar, 1000);
atualizar();

/* 🎉 CONFETE */
function criarConfete() {
  const c = document.createElement("div");
  c.classList.add("confete");

  c.style.left = Math.random() * 100 + "vw";
  c.style.backgroundColor = `hsl(${Math.random() * 360},100%,60%)`;
  c.style.animationDuration = (Math.random() * 3 + 2) + "s";
  c.style.width = (Math.random() * 6 + 6) + "px";
  c.style.height = c.style.width;

  document.body.appendChild(c);

  setTimeout(() => c.remove(), 6000);
}

setInterval(criarConfete, 120);

/* 🎆 FOGOS */
function criarFogo() {
  const f = document.createElement("div");
  f.classList.add("fogo");

  f.style.left = Math.random() * 100 + "vw";
  f.style.top = Math.random() * 60 + 20 + "vh";
  f.style.backgroundColor = `hsl(${Math.random() * 360},100%,60%)`;

  document.body.appendChild(f);

  setTimeout(() => f.remove(), 1000);
}

setInterval(criarFogo, 800);

});
</script>

</body>
</html>
