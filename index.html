<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contagem Regressiva</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      z-index: 1;
      padding: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 30px;
      font-size: 1.2rem;
      color: #cbd5f5;
    }

    /* 🔥 NOVO ESTILO DO CONTADOR */
    #contador {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .box {
      background: rgba(255,255,255,0.1);
      padding: 20px 25px;
      border-radius: 15px;
      min-width: 100px;
      backdrop-filter: blur(10px);
    }

    .numero {
      font-size: 3rem;
      font-weight: bold;
    }

    .label {
      font-size: 1rem;
      color: #cbd5f5;
    }

    /* Confete */
    .confete {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: cair linear infinite;
    }

    @keyframes cair {
      to {
        transform: translateY(100vh) rotate(720deg);
      }
    }

    /* Responsivo */
    @media (max-width: 500px) {
      .numero {
        font-size: 2.2rem;
      }
      .box {
        min-width: 80px;
        padding: 15px;
      }
    }

  </style>
</head>

<body>

  <div class="container">
    <h1>Está chegando o grande momento 🎉</h1>
    <p>Contagem regressiva até amanhã às 16:00</p>

    <div id="contador">
      <div class="box">
        <div class="numero" id="dias">0</div>
        <div class="label">dias</div>
      </div>
      <div class="box">
        <div class="numero" id="horas">0</div>
        <div class="label">horas</div>
      </div>
      <div class="box">
        <div class="numero" id="minutos">0</div>
        <div class="label">minutos</div>
      </div>
      <div class="box">
        <div class="numero" id="segundos">0</div>
        <div class="label">segundos</div>
      </div>
    </div>
  </div>

  <script>
    function getTargetDate() {
      const agora = new Date();
      const alvo = new Date();
      alvo.setDate(agora.getDate() + 1);
      alvo.setHours(16, 0, 0, 0);
      return alvo;
    }

    const dataAlvo = getTargetDate();

    function atualizarContador() {
      const agora = new Date();
      const diferenca = dataAlvo - agora;

      if (diferenca <= 0) {
        document.getElementById("contador").innerHTML = "🎊 Chegou o grande momento!";
        return;
      }

      const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
      const horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
      const minutos = Math.floor((diferenca / (1000 * 60)) % 60);
      const segundos = Math.floor((diferenca / 1000) % 60);

      document.getElementById("dias").textContent = dias;
      document.getElementById("horas").textContent = horas;
      document.getElementById("minutos").textContent = minutos;
      document.getElementById("segundos").textContent = segundos;
    }

    setInterval(atualizarContador, 1000);
    atualizarContador();

    function criarConfete() {
      const confete = document.createElement("div");
      confete.classList.add("confete");

      confete.style.left = Math.random() * 100 + "vw";
      confete.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
      confete.style.animationDuration = (Math.random() * 3 + 2) + "s";

      document.body.appendChild(confete);

      setTimeout(() => confete.remove(), 5000);
    }

    setInterval(criarConfete, 200);
  </script>

</body>
</html>
